<!doctype html><html lang="zh"><head><meta charset="utf-8"><style>
body{margin:0;background:#2a2f4a;font:11px sans-serif;color:#ddd}
.grid{display:grid;grid-template-columns:repeat(var(--cols),180px);gap:4px;padding:6px}
.cell{position:relative;width:180px;height:200px;background:linear-gradient(#3a4270,#262b45);border-radius:4px;overflow:hidden}
.cell .bfx-sprite{position:absolute;left:10px;top:10px;width:160px;height:160px}
.cell span{position:absolute;left:3px;bottom:2px;right:3px;white-space:nowrap;overflow:hidden}
.cell:after{content:"";position:absolute;left:0;right:0;top:170px;border-top:1px dashed #fff4}
</style></head><body><div class="grid" id="g"></div>
<script>window.GM_getValue=(k,d)=>k==='battle_fx_cfg_v1'?{assetBase:'http://127.0.0.1:8799'}:d;window.GM_xmlhttpRequest=o=>fetch(o.url).then(r=>r.text()).then(t=>o.onload({responseText:t})).catch(()=>o.onerror&&o.onerror());window.GM_setValue=()=>{};window.GM_registerMenuCommand=()=>0;window.GM_unregisterMenuCommand=()=>{};window.GM_info={script:{version:'test'}};</script>
<script src="mwi-battle-fx.user.js"></script>
<script>
// ?spec=<json>: {cols, cells:[{u:{avatar,outfit,items,style}, pose, label}]}
async function run(){
  const spec=JSON.parse(decodeURIComponent(location.hash.slice(1)))
  const D=window.__mwiBattleFx.Doll;window.__mwiBattleFx.Stage.injectCss()
  for(let k=0;k<100&&!D.ready();k++) await new Promise(r=>setTimeout(r,100))
  const g=document.getElementById('g'); g.style.setProperty('--cols',spec.cols)
  for(const c of spec.cells){
    const cell=document.createElement('div');cell.className='cell'
    const sp=document.createElement('div');sp.className='bfx-sprite'
    const d=D.build({lab:true,...c.u})
    if(d){d.pose(c.pose||'idle',c.u.style);sp.appendChild(d.el)}
    const s=document.createElement('span');s.textContent=c.label||''
    cell.append(sp,s);g.appendChild(cell)
  }
  await new Promise(r=>setTimeout(r,1500))
  document.title='ready'
}
run()
</script></body></html>
