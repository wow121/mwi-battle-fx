const ws=new WebSocket('ws://api.milkywayidle.com.invalid/ws');ws.onerror=()=>{};
const feed=o=>ws.dispatchEvent(new MessageEvent('message',{data:JSON.stringify(o)}));
ws.addEventListener('message',e=>{void e.data});
const P=(name,style,dt,ab,hrid)=>({name,hrid,currentHitpoints:1200,currentManapoints:600,preparingAbilityHrid:ab,combatDetails:{maxHitpoints:1200,maxManapoints:800,combatStats:{combatStyleHrids:['/combat_styles/'+style],damageType:'/damage_types/'+dt}}});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function start(){
 feed({type:'init_character_data',character:{name:'战士'},characterActions:[{actionHrid:'/actions/combat/golem_cave',difficultyTier:4,isDone:false}],characterItems:[{itemLocationHrid:'/item_locations/main_hand',itemHrid:'/items/furious_spear',count:1},{itemLocationHrid:'/item_locations/off_hand',itemHrid:'/items/azure_buckler',count:1}]});
 feed({type:'new_battle',players:[P('战士','slash','physical','/abilities/cleave'),P('弓手','ranged','physical','/abilities/flame_arrow'),P('法师','magic','fire','/abilities/fireball')],
  monsters:[P('花岗岩魔像','smash','physical',null,'/monsters/granite_golem'),P('磁力魔像','smash','physical',null,'/monsters/magnetic_golem'),P('钟乳石魔像','stab','physical',null,'/monsters/stalactite_golem'),P('水晶巨像','magic','water',null,'/monsters/crystal_colossus')]});
 await sleep(1500);
 feed({type:'battle_updated',pMap:{0:{cHP:1200,cMP:600,atkCounter:10,dmgCounter:0,critCounter:0},1:{cHP:1200,cMP:600,atkCounter:10,dmgCounter:0},2:{cHP:1200,cMP:600,atkCounter:10,dmgCounter:0,abilityHrid:'/abilities/fireball'}},mMap:{0:{cHP:1200,cMP:600,atkCounter:5,dmgCounter:0},1:{cHP:1200,cMP:600,atkCounter:5,dmgCounter:0},2:{cHP:1200,cMP:600,atkCounter:5,dmgCounter:0},3:{cHP:1200,cMP:600,atkCounter:5,dmgCounter:0}}});
 feed({type:'battle_updated',pMap:{2:{cHP:1200,cMP:570,atkCounter:11,abilityHrid:'/abilities/entangle'}},mMap:{1:{cHP:800,dmgCounter:1}}}); await sleep(1300);
 feed({type:'battle_updated',pMap:{0:{cHP:1200,cMP:600,atkCounter:11,critCounter:1}},mMap:{0:{cHP:1000,dmgCounter:1}}}); await sleep(1300);
 feed({type:'battle_updated',pMap:{1:{cHP:1050,dmgCounter:1}},mMap:{1:{cHP:800,atkCounter:6}}}); await sleep(1400);
 document.querySelector('.bfx-toggle').click(); await sleep(1500);
 document.querySelector('.bfx-toggle').click(); await sleep(1000);
 document.querySelector('.bfx-tab').click(); await sleep(800);
 const order=['狂暴','物理光环','分裂斩','缠绕'];
 const btns=[...document.querySelectorAll('.bfx-lab button.skill')];
 for(const name of order){ const b=btns.find(x=>x.textContent===name); window.__step=name; if(b) b.click(); await sleep(1500); }
}
